services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skopos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skopos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skopos} -d ${POSTGRES_DB:-skopos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  skopos:
    build:
      context: .
    image: skopos:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SKOPOS_LANGUAGE: ${SKOPOS_LANGUAGE:-en}
      SKOPOS_PG_DSN: postgres://${POSTGRES_USER:-skopos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-skopos}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SKOPOS_LLM_PROVIDER: ${SKOPOS_LLM_PROVIDER:-}
      SKOPOS_LLM_MODEL: ${SKOPOS_LLM_MODEL:-}
      SKOPOS_LLM_BASE_URL: ${SKOPOS_LLM_BASE_URL:-}
      SKOPOS_LLM_PROXY: ${SKOPOS_LLM_PROXY:-}
      SKOPOS_TRAFFIC_BLOB_BYTES: ${SKOPOS_TRAFFIC_BLOB_BYTES:-1073741824}
      SKOPOS_TRAFFIC_INDEX_BYTES: ${SKOPOS_TRAFFIC_INDEX_BYTES:-1073741824}
      SKOPOS_TRAFFIC_WAL_BYTES: ${SKOPOS_TRAFFIC_WAL_BYTES:-134217728}
      SKOPOS_TRAFFIC_FREE_BYTES: ${SKOPOS_TRAFFIC_FREE_BYTES:-268435456}
      SKOPOS_TRAFFIC_EXCHANGE_BYTES: ${SKOPOS_TRAFFIC_EXCHANGE_BYTES:-67108864}
      SKOPOS_TRAFFIC_HOST_BYTES: ${SKOPOS_TRAFFIC_HOST_BYTES:-268435456}
      SKOPOS_TRAFFIC_MAX_EXCHANGES: ${SKOPOS_TRAFFIC_MAX_EXCHANGES:-100000}
      SKOPOS_TASK_ARCHIVE_BYTES: ${SKOPOS_TASK_ARCHIVE_BYTES:-4294967296}
      SKOPOS_PROXY_CLIENT_CIDRS: ${SKOPOS_PROXY_CLIENT_CIDRS:-}
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
      - ./tls:/app/tls:ro
    restart: unless-stopped

volumes:
  pgdata:
